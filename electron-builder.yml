appId: com.vela.iris
productName: IRIS
copyright: © VELA
directories:
  output: release
  buildResources: build
files:
  - out/**
  - build/icon.png
  - package.json
extraResources:
  - from: backend/dist/iris-backend
    to: backend
    filter:
      - "**/*"
  # Modèle d'écoute Vosk français (petit, hors-ligne). Copié dans resources/backend/models, là où
  # stt.py::dossiers_modeles le cherche (exe.parent / "models") : IRIS entend dès la 1re seconde,
  # sur une machine neuve, sans aucun téléchargement.
  - from: backend/dev-data/models/vosk-model-small-fr-0.22
    to: backend/models/vosk-model-small-fr-0.22
    filter:
      - "**/*"
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: IRIS-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: IRIS
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.productivity
linux:
  target: AppImage
  icon: build/icon.png
  category: Utility
publish: null
